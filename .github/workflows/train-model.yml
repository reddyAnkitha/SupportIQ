name: Train SupportIQ Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Train satisfaction model
        run: |
          python backend/ml/train_model.py

      - name: Check generated model
        run: |
          ls -lh backend/models/

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: satisfaction-model
          path: backend/models/satisfaction_model.pkl

      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/models/satisfaction_model.pkl backend/models/metadata.json
          git commit -m "Update trained satisfaction model" || echo "No changes to commit"
          git push
